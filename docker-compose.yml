
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3055:3100"
    environment:
      - NODE_ENV=development
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - database4life
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8055:8055"
    volumes:
      - .:/app
    networks:
      - database4life
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://psusr_opeus_eelci:pasrd_anus@postgres:5438/db_openmanus

networks:
  database4life:
    external: true
